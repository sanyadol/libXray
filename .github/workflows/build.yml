name: Build libXray v26.9.9 Android

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exact libXray v26.9.9
        uses: actions/checkout@v4
        with:
          ref: 50b95979f5db551bd273165cf469e5daaf791341
          fetch-depth: 1

      - name: Verify exact commit
        run: |
          echo "Expected:"
          echo "50b95979f5db551bd273165cf469e5daaf791341"
          echo "Actual:"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "50b95979f5db551bd273165cf469e5daaf791341"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Verify Android toolchain
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "NDK_PATH=${{ steps.ndk.outputs.ndk-path }}"
          go version
          python3 --version
          java -version
          ls -la "$ANDROID_NDK_HOME"
          cat "$ANDROID_NDK_HOME/source.properties"

      - name: Build libXray
        env:
          GOFLAGS: "-ldflags=-checklinkname=0"
          LIBXRAY_GOMOBILE_VERSION: "v0.0.0-20260908204917-8b95e45f8d3e"
        run: |
          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== BUILD ==="
          python3 build/main.py android

      - name: Verify AAR
        run: |
          test -f libXray.aar
          test -f libXray-sources.jar

          echo "=== FILES ==="
          ls -lh libXray.aar
          ls -lh libXray-sources.jar

          echo "=== AAR CONTENT ==="
          unzip -l libXray.aar | grep -E "jni|arm64-v8a|classes.jar"

      - name: Upload Android AAR
        uses: actions/upload-artifact@v4
        with:
          name: libXray-v26.9.9-android
          path: |
            libXray.aar
            libXray-sources.jar
