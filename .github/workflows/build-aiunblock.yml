name: Build AIUnblock Universal Control

on:
  push:
    branches:
      - aiunblock-universal-control
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check libXray
        working-directory: android
        run: |
          echo "=== libXray ==="
          ls -lh app/libs/libXray.aar
          test -f app/libs/libXray.aar

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Prepare Capacitor assets
        working-directory: android
        run: |
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/capacitor.config.json <<'EOF'
          {
            "appId": "com.aiunblock.universal.control",
            "appName": "AIUnblock Universal Control",
            "webDir": "dist"
          }
          EOF
          cat > app/src/main/assets/capacitor.plugins.json <<'EOF'
          [
            {
              "pkg": "@capacitor/app",
              "classpath": "com.capacitorjs.plugins.app.AppPlugin"
            },
            {
              "pkg": "@capacitor/browser",
              "classpath": "com.capacitorjs.plugins.browser.BrowserPlugin"
            }
          ]
          EOF
          echo "=== Capacitor assets ==="
          ls -lh app/src/main/assets/capacitor*.json

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find android/app/build/outputs/apk -type f -name '*.apk' -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIUnblock-Universal-Control-debug
          path: android/app/build/outputs/apk/debug/*.apk
